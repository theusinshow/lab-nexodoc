<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=1080">
    <title>Nexo, do carimbo ao volume</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: #08090b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <!--
      DO CARIMBO AO VOLUME. 15 s em loop para o painel da tela de entrada.
      A mesa (o mapa do volume com a câmera) e o letreiro (marca, parecer e
      tipografia) correm no mesmo relógio. O último quadro é o primeiro.
    -->
    <div data-hf-id="hf-cfa3" id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1440" data-height="1080">
      <div data-hf-id="hf-9j58" id="mesa" data-composition-id="mesa" data-composition-src="compositions/mesa.html" data-start="0" data-duration="15" data-track-index="0" data-width="1440" data-height="1080"></div>
      <div data-hf-id="hf-qytn" id="letreiro" data-composition-id="letreiro" data-composition-src="compositions/letreiro.html" data-start="0" data-duration="15" data-track-index="1" data-width="1440" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
