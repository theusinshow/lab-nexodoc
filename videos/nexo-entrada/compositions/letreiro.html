<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Letreiro: marca, parecer e tipografia</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("assets/fonts/Geist.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono.woff2") format("woff2"); font-weight: 100 900; }

        #root { position: absolute; inset: 0; color: #eeeff2; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

        .hud { position: absolute; left: 130px; right: 130px; top: 84px; display: flex; justify-content: space-between; align-items: flex-start; }
        .marca { display: flex; align-items: center; gap: 14px; }
        .orbe { position: relative; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 22px rgb(140 143 255 / 0.32); }
        .orbe-a { position: absolute; inset: 0; border-radius: 50%;
          background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / 0.85) 0 4%, transparent 22%), conic-gradient(from 0deg, #8c8fff, #6fc3ff, #e8b7ff, #ffc98a, #9ea2ff, #8c8fff); }
        .orbe-b { position: absolute; inset: 0; border-radius: 50%;
          background: radial-gradient(circle at 70% 78%, rgb(8 9 11 / 0.55), transparent 55%), radial-gradient(circle at 50% 50%, transparent 58%, rgb(255 255 255 / 0.18) 70%, transparent 72%); }
        .marca-txt b { display: block; font-family: "Geist Mono", monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; }
        .marca-txt i { display: block; margin-top: 7px; font-style: normal; font-family: "Geist Mono", monospace; font-size: 16px; color: #a4a8b3; letter-spacing: 0.01em; }

        .parecer { width: 500px; }
        .parecer-tit { display: flex; justify-content: space-between; font-family: "Geist Mono", monospace; font-size: 15px; color: #a4a8b3; }
        .parecer-tit b { font-weight: 400; }
        .faixa { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 26px; }
        .seg i { display: block; height: 5px; border-radius: 3px; transform-origin: 0 50%; }
        .seg span { display: block; margin-top: 9px; font-family: "Geist Mono", monospace; font-size: 13px; color: #a4a8b3; letter-spacing: 0.02em; white-space: nowrap; }
        .losango { position: absolute; left: 0; top: -15px; width: 11px; height: 11px; margin-left: -5.5px; background: #eeeff2; box-shadow: 0 0 0 3px #08090b; }
        .achados { margin-top: 20px; display: grid; gap: 10px; }
        .achado { position: relative; display: flex; align-items: center; gap: 10px; font-size: 15px; color: #a4a8b3; white-space: nowrap; }
        .achado .pt { width: 8px; height: 8px; border-radius: 50%; flex: none; }
        .achado code { font-family: "Geist Mono", monospace; font-size: 14px; color: #eeeff2; }
        .achado .estado { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 13px; }
        .risco { position: absolute; left: 18px; right: 96px; top: 50%; height: 1.5px; background: #a4a8b3; transform-origin: 0 50%; }

        .tipo { position: absolute; left: 130px; right: 130px; bottom: 92px; height: 150px; }
        .linha { position: absolute; left: 0; bottom: 44px; white-space: nowrap; font-size: 70px; font-weight: 560; letter-spacing: -0.035em; line-height: 1.05; }
        .m { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.04em 0.14em 0; margin-bottom: -0.14em; }
        .w { display: inline-block; }
        .w.leve { color: #a4a8b3; font-weight: 400; }
        .legenda { position: absolute; left: 2px; bottom: 0; font-family: "Geist Mono", monospace; font-size: 18px; color: #a4a8b3; white-space: nowrap; letter-spacing: 0.01em; }
        .legenda b { font-weight: 400; color: #eeeff2; font-variant-numeric: tabular-nums; }
      </style>

      <div data-hf-id="hf-ho5w" id="root" data-composition-id="letreiro" data-width="1440" data-height="1080">
        <header data-hf-id="hf-kve3" class="hud">
          <div data-hf-id="hf-1o9k" class="marca">
            <div data-hf-id="hf-c3ew" class="orbe"><div data-hf-id="hf-x16i" class="orbe-a" id="orbeA" data-layout-ignore=""></div><div data-hf-id="hf-h9x8" class="orbe-b" id="orbeB" data-layout-ignore=""></div></div>
            <div data-hf-id="hf-1lvb" class="marca-txt"><b data-hf-id="hf-dq2m">117-25</b><i data-hf-id="hf-e3tk">UBS da Rua São Francisco de Assis</i></div>
          </div>
          <div data-hf-id="hf-7k92" class="parecer" id="parecer">
            <div data-hf-id="hf-jg3w" class="parecer-tit"><span data-hf-id="hf-spqa">parecer da auditoria</span><b data-hf-id="hf-fvi0" id="parecerEstado">—</b></div>
            <div data-hf-id="hf-tu75" class="faixa">
              <div data-hf-id="hf-ta0z" class="seg"><i data-hf-id="hf-x8wz" style="background: #7bd8a5"></i><span data-hf-id="hf-erin">liberado</span></div>
              <div data-hf-id="hf-xb43" class="seg"><i data-hf-id="hf-kizk" style="background: #d9c27a"></i><span data-hf-id="hf-a94i">com ressalvas</span></div>
              <div data-hf-id="hf-wwt2" class="seg"><i data-hf-id="hf-t10u" style="background: #f0b45c"></i><span data-hf-id="hf-k2bt">revisar</span></div>
              <div data-hf-id="hf-wii1" class="seg"><i data-hf-id="hf-g1n0" style="background: #ff7d6e"></i><span data-hf-id="hf-owzd">não emitir</span></div>
              <div data-hf-id="hf-ia3g" class="losango" id="losango"></div>
            </div>
            <div data-hf-id="hf-gfrh" class="achados">
              <div data-hf-id="hf-oxjm" class="achado" id="a1"><i data-hf-id="hf-ps6l" class="pt" id="a1pt" style="background: #f0b45c"></i><code data-hf-id="hf-xiyb" data-layout-allow-occlusion="">ACH-014</code><span data-hf-id="hf-z91z" data-layout-allow-occlusion="">ARQ-03 · revisão A, as outras em B</span><span data-hf-id="hf-ct9k" class="estado" id="a1est">pendente</span><i data-hf-id="hf-o1ig" class="risco" id="a1risco" data-layout-allow-occlusion=""></i></div>
              <div data-hf-id="hf-kzfl" class="achado" id="a2"><i data-hf-id="hf-tez0" class="pt" id="a2pt" style="background: #ff7d6e"></i><code data-hf-id="hf-xx9c" data-layout-allow-occlusion="">ACH-015</code><span data-hf-id="hf-2tv3" data-layout-allow-occlusion="">ELE-04 · carimbo sem número</span><span data-hf-id="hf-1ekd" class="estado" id="a2est">pendente</span><i data-hf-id="hf-b2rh" class="risco" id="a2risco" data-layout-allow-occlusion=""></i></div>
            </div>
          </div>
        </header>

        <div data-hf-id="hf-6n4q" class="tipo">
          <div data-hf-id="hf-dv3v" class="linha" id="l1"><span data-hf-id="hf-7yfe" class="m"><span data-hf-id="hf-pb6v" class="w" data-layout-allow-overlap="" data-layout-allow-overflow="">Lê</span></span> <span data-hf-id="hf-48ge" class="m"><span data-hf-id="hf-skkk" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">o</span></span> <span data-hf-id="hf-4mrf" class="m"><span data-hf-id="hf-ltbg" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">carimbo.</span></span></div>
          <div data-hf-id="hf-5780" class="linha" id="l2"><span data-hf-id="hf-512g" class="m"><span data-hf-id="hf-7qku" class="w" data-layout-allow-overlap="" data-layout-allow-overflow="">Monta</span></span> <span data-hf-id="hf-28x9" class="m"><span data-hf-id="hf-7gt8" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">o</span></span> <span data-hf-id="hf-2n8a" class="m"><span data-hf-id="hf-zk5l" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">volume.</span></span></div>
          <div data-hf-id="hf-5yvt" class="linha" id="l3"><span data-hf-id="hf-31jb" class="m"><span data-hf-id="hf-2nt3" class="w" data-layout-allow-overlap="" data-layout-allow-overflow="">Confere</span></span> <span data-hf-id="hf-3fuc" class="m"><span data-hf-id="hf-8bl6" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">antes.</span></span></div>
          <div data-hf-id="hf-v3e6" class="linha" id="l4"><span data-hf-id="hf-70ll" class="m"><span data-hf-id="hf-o9nw" class="w" data-layout-allow-overlap="" data-layout-allow-overflow="">Gera</span></span> <span data-hf-id="hf-7ewm" class="m"><span data-hf-id="hf-sctx" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">os</span></span> <span data-hf-id="hf-ydwa" class="m"><span data-hf-id="hf-cgt3" class="w leve" data-layout-allow-overlap="" data-layout-allow-overflow="">tomos.</span></span></div>
          <div data-hf-id="hf-c8s9" class="legenda" id="g1" data-layout-allow-overlap="">folha · disciplina · revisão · título</div>
          <div data-hf-id="hf-v25n" class="legenda" id="g2" data-layout-allow-overlap=""><b data-hf-id="hf-v06n" id="g2n">0</b> folhas lidas, em <b data-hf-id="hf-rxpx">2</b> tomos</div>
          <div data-hf-id="hf-5qcm" class="legenda" id="g3" data-layout-allow-overlap=""><b data-hf-id="hf-n9he" id="g3n">0</b> achados · <b data-hf-id="hf-rucw" id="g3p">0</b> pendentes</div>
          <div data-hf-id="hf-5gct" class="legenda" id="g4" data-layout-allow-overlap=""><b data-hf-id="hf-6zvt" id="g4n">0</b> páginas em <b data-hf-id="hf-mt2h">2</b> volumes</div>
        </div>
      </div>

      <script>
        /* O LETREIRO, no mesmo relógio da mesa (compositions/mesa.html):
           os achados acendem quando o feixe passa pelos cartões. */
        (() => {
          const D = 15;
          const RELOGIO = { achadoArq: 8.13, achadoEle: 8.75, corrigeEle: 9.75, corrigeArq: 10.35, fecha: 12.45 };
          const tl = gsap.timeline({ paused: true });

          gsap.set("#parecer", { opacity: 0 });
          gsap.set(".seg i", { scaleX: 0 });
          gsap.set(["#a1", "#a2"], { opacity: 0 });
          gsap.set(["#a1risco", "#a2risco"], { scaleX: 0 });
          gsap.set(".tipo .w", { yPercent: 115 });
          gsap.set(".legenda", { opacity: 0 });

          // o orbe gira uma volta inteira por ciclo: o último quadro é o primeiro
          tl.fromTo("#orbeA", { rotation: 0 }, { rotation: 360, duration: D, ease: "none" }, 0);
          tl.fromTo("#orbeB", { rotation: 0 }, { rotation: -360, duration: D, ease: "none" }, 0);

          /* a tipografia: cada palavra sobe de dentro da sua máscara */
          const entra = (id, t) => tl.fromTo(`${id} .w`, { yPercent: 115 }, { yPercent: 0, duration: 0.62, ease: "power3.out", stagger: 0.06, immediateRender: false }, t);
          const sai = (id, t) => tl.to(`${id} .w`, { yPercent: -115, duration: 0.36, ease: "power3.in", stagger: 0.035 }, t);
          const entraLeg = (id, t) => tl.fromTo(id, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false }, t);
          const saiLeg = (id, t) => tl.to(id, { opacity: 0, y: -6, duration: 0.25, ease: "power2.in" }, t);
          const contar = (id, de, ate, ini, dur, ease = "power2.out") => {
            const alvo = document.getElementById(id);
            const pr = { v: de };
            tl.fromTo(pr, { v: de }, { v: ate, duration: dur, ease, immediateRender: false, onUpdate: () => (alvo.textContent = String(Math.round(pr.v))) }, ini);
          };

          entra("#l1", 0.5); entraLeg("#g1", 0.85);
          sai("#l1", 3.25); saiLeg("#g1", 3.2);
          entra("#l2", 3.55); entraLeg("#g2", 3.85); contar("g2n", 0, 33, 3.85, 1.9);
          sai("#l2", 5.85); saiLeg("#g2", 5.8);
          entra("#l3", 6.25); entraLeg("#g3", 6.6);
          sai("#l3", 10.95); saiLeg("#g3", 10.9);
          entra("#l4", 11.2); entraLeg("#g4", 11.45); contar("g4n", 0, 412, 11.7, 0.78);
          sai("#l4", 12.3); saiLeg("#g4", 12.25);

          /* o parecer: a faixa se desenha, o losango anda a cada achado e volta quando eles se resolvem */
          const COL = (500 - 3 * 8) / 4;
          const xDe = (i) => i * (COL + 8) + COL / 2;
          gsap.set("#losango", { opacity: 0, x: xDe(0), rotation: 45 });
          tl.fromTo("#parecer", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.15);
          tl.fromTo(".seg i", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", stagger: 0.07, immediateRender: false }, 6.25);
          tl.fromTo("#losango", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 6.75);

          const { achadoArq: t1, achadoEle: t2, corrigeEle: ce, corrigeArq: ca } = RELOGIO;
          tl.fromTo("#a1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t1 + 0.1);
          tl.fromTo("#losango", { x: xDe(0) }, { x: xDe(1), duration: 0.42, ease: "power3.inOut", immediateRender: false }, t1 + 0.12);
          contar("g3n", 0, 1, t1 + 0.1, 0.1, "none"); contar("g3p", 0, 1, t1 + 0.1, 0.1, "none");
          tl.fromTo("#a2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t2 + 0.1);
          tl.fromTo("#losango", { x: xDe(1) }, { x: xDe(3), duration: 0.5, ease: "power3.inOut", immediateRender: false }, t2 + 0.12);
          contar("g3n", 1, 2, t2 + 0.1, 0.1, "none"); contar("g3p", 1, 2, t2 + 0.1, 0.1, "none");

          tl.to("#a2pt", { backgroundColor: "#7bd8a5", duration: 0.2 }, ce + 0.3);
          tl.fromTo("#a2risco", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut", immediateRender: false }, ce + 0.3);
          tl.fromTo("#losango", { x: xDe(3) }, { x: xDe(1), duration: 0.5, ease: "power3.inOut", immediateRender: false }, ce + 0.4);
          contar("g3p", 2, 1, ce + 0.35, 0.1, "none");
          tl.to("#a1pt", { backgroundColor: "#7bd8a5", duration: 0.2 }, ca + 0.2);
          tl.fromTo("#a1risco", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut", immediateRender: false }, ca + 0.2);
          tl.fromTo("#losango", { x: xDe(1) }, { x: xDe(0), duration: 0.55, ease: "power3.inOut", immediateRender: false }, ca + 0.3);
          contar("g3p", 1, 0, ca + 0.25, 0.1, "none");

          tl.to("#parecer", { opacity: 0, y: -8, duration: 0.4, ease: "power2.in" }, RELOGIO.fecha - 0.2);
          tl.set(["#a1pt"], { backgroundColor: "#f0b45c" }, 14.6);
          tl.set(["#a2pt"], { backgroundColor: "#ff7d6e" }, 14.6);
          tl.set(["#a1risco", "#a2risco"], { scaleX: 0 }, 14.6);
          tl.set(["#a1", "#a2", "#losango"], { opacity: 0 }, 14.6);
          tl.set(".seg i", { scaleX: 0 }, 14.6);

          /* textos de estado: escritos depois dos tweens, como função do tempo e do losango */
          const ESTADOS = [["Liberado", "#7bd8a5"], ["Com ressalvas", "#d9c27a"], ["Revisar", "#f0b45c"], ["Não emitir", "#ff7d6e"]];
          const losango = document.getElementById("losango");
          const estado = document.getElementById("parecerEstado");
          const a1est = document.getElementById("a1est"), a2est = document.getElementById("a2est");
          const escrever = () => {
            const t = tl.time();
            if (Number(gsap.getProperty(losango, "opacity")) < 0.05) { estado.textContent = "—"; estado.style.color = "#a4a8b3"; }
            else if (t < 9.45) { estado.textContent = "auditando"; estado.style.color = "#a3a6ff"; }
            else {
              const i = Math.max(0, Math.min(3, Math.round((Number(gsap.getProperty(losango, "x")) - xDe(0)) / (COL + 8))));
              estado.textContent = ESTADOS[i][0];
              estado.style.color = ESTADOS[i][1];
            }
            const r1 = t >= ca + 0.35 && t < 14.6, r2 = t >= ce + 0.45 && t < 14.6;
            a1est.textContent = r1 ? "resolvido" : "pendente"; a1est.style.color = r1 ? "#7bd8a5" : "#f0b45c";
            a2est.textContent = r2 ? "resolvido" : "pendente"; a2est.style.color = r2 ? "#7bd8a5" : "#ff7d6e";
          };
          tl.eventCallback("onUpdate", escrever);
          escrever();

          window.__timelines["letreiro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
